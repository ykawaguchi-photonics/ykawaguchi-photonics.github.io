abstract: "Topological boundary modes in electronic and classical-wave systems exhibit fascinating properties. In photonics, topological nature of boundary modes can make them robust and endows them with an additional internal structure—pseudo-spins. Here, we introduce heterogeneous boundary modes, which are based on mixing two of the most widely used topological photonics platforms—the pseudo-spin–Hall-like and valley-Hall photonic topological insulators. We predict and confirm experimentally that transformation between the two, realized by altering the lattice geometry, enables a continuum of boundary states carrying both pseudo-spin and valley degrees of freedom (DoFs). When applied adiabatically, this leads to conversion between pseudo-spin and valley polarization. We show that such evolution gives rise to a geometrical phase associated with the synthetic gauge fields, which is confirmed via an Aharonov-Bohm type experiment on a silicon chip. Our results unveil a versatile approach to manipulating properties of topological photonic states and envision topological photonics as a powerful platform for devices based on synthetic DoFs."
